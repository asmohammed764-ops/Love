<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #111;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* شاشة القفل */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('bg_lock.jpg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lock-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 350px;
      width: 90%;
    }

    .lock-card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: #222;
    }

    .lock-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 25px;
      text-align: center;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
    }

    .lock-card button {
      background: #ff4b72;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .lock-card button:hover {
      background: #e03a5f;
    }

    /* المحتوى الرئيسي */
    #main-content {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: url('bg_main.jpg') no-repeat center center/cover attachment;
      padding: 20px 10px;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    /* عداد الأيام */
    .timer-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .timer-subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .timer-box {
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 5px;
      border-radius: 12px;
    }

    .timer-box span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .timer-box label {
      font-size: 0.75rem;
      color: #555;
    }

    .quote {
      font-weight: bold;
      color: #ff4b72;
      font-size: 0.95rem;
    }

    /* المشغل الموسيقي */
    .audio-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
    }

    .audio-info {
      text-align: right;
    }

    .audio-info div {
      font-weight: bold;
    }

    .audio-info span {
      font-size: 0.8rem;
      color: #666;
    }

    .play-btn {
      background: #6a1b4d;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* الفيديو */
    .video-card video {
      width: 100%;
      border-radius: 15px;
      outline: none;
      max-height: 250px;
      object-fit: cover;
    }

    /* كارت الرسالة والصور */
    .letter-card {
      position: relative;
      background: rgba(255, 255, 255, 0.92);
      border: 1px dashed #ccc;
    }

    .letter-date {
      font-weight: bold;
      margin-bottom: 15px;
      color: #444;
    }

    .letter-img-container {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      margin: 15px 0;
    }

    .letter-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .letter-text {
      line-height: 1.8;
      font-size: 1rem;
      color: #333;
    }

    .next-btn {
      margin-top: 15px;
      background: transparent;
      border: 1px solid #777;
      padding: 6px 18px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- شاشة القفل -->
  <div id="lock-screen">
    <div class="lock-card">
      <h2>لأغلى شخص في عمري 🥰</h2>
      <input type="password" id="pass-input" placeholder="كلمة السر...">
      <button onclick="unlock()">فتح</button>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div id="main-content">
    <div class="container">

      <!-- العداد -->
      <div class="card">
        <div class="timer-title">✨ Forever ✨</div>
        <div class="timer-subtitle">❤️ Since: 20 - 01 - 2025</div>
        <div class="timer-grid">
          <div class="timer-box"><span id="days">0</span><label>يوم</label></div>
          <div class="timer-box"><span id="hours">0</span><label>ساعة</label></div>
          <div class="timer-box"><span id="minutes">0</span><label>دقيقة</label></div>
          <div class="timer-box"><span id="seconds">0</span><label>ثانية</label></div>
        </div>
        <div class="quote">❤️ الجزء الأجمل من حياتي هو أنت ❤️</div>
      </div>

      <!-- مشغل الأغنية -->
      <div class="card audio-card">
        <div class="audio-info">
          <div>Amr Diab</div>
          <span id="audio-status">Playing...</span>
        </div>
        <button class="play-btn" id="play-toggle" onclick="toggleAudio()">❚❚</button>
      </div>
      <audio id="bg-audio" loop src="amr_diab.mp3"></audio>

      <!-- الفيديو -->
      <div class="card video-card">
        <video id="my-video" controls playsinline loop preload="metadata">
          <source src="video1.mp4" type="video/mp4">
          متصفحك لا يدعم تشغيل الفيديو.
        </video>
      </div>

      <!-- كارت الصور والرسالة المتغيرة -->
      <div class="card letter-card">
        <div class="letter-date">01/11/2026</div>
        <div class="letter-img-container">
          <img id="slide-img" src="photo1.jpg" alt="Memory Photo">
        </div>
        <div class="letter-text" id="slide-text">
          إلى حبيبي ورفيق عمري ..<br>
          في يوم ميلادك، أتمنى لك أعواماً مليئة بالفرح، وقلباً لا يعرف الحزن، وأياماً تشبه جمال روحك.
        </div>
        <button class="next-btn" onclick="nextSlide()">➔ next</button>
      </div>

    </div>
  </div>

  <script>
    // كلمة السر
    function unlock() {
      const pass = document.getElementById('pass-input').value;
      if (pass === '2012025') {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'flex';
        
        // تشغيل الموسيقى والفيديو
        const audio = document.getElementById('bg-audio');
        audio.play().catch(e => console.log(e));

        const video = document.getElementById('my-video');
        video.play().catch(e => console.log(e));

        startTimer();
      } else {
        alert('كلمة السر غير صحيحة!');
      }
    }

    // العداد الزمنِي
    function startTimer() {
      const startDate = new Date('2025-01-20T00:00:00');
      setInterval(() => {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('days').innerText = days;
        document.getElementById('hours').innerText = hours;
        document.getElementById('minutes').innerText = minutes;
        document.getElementById('seconds').innerText = seconds;
      }, 1000);
    }

    // تشغيل وإيقاف الصوت
    function toggleAudio() {
      const audio = document.getElementById('bg-audio');
      const btn = document.getElementById('play-toggle');
      const status = document.getElementById('audio-status');

      if (audio.paused) {
        audio.play();
        btn.innerText = '❚❚';
        status.innerText = 'Playing...';
      } else {
        audio.pause();
        btn.innerText = '▶';
        status.innerText = 'Paused';
      }
    }

    // التنقل بين الصور والرسائل
    const slides = [
      { img: 'photo1.jpg', text: 'إلى حبيبي ورفيق عمري ..<br>في يوم ميلادك، أتمنى لك أعواماً مليئة بالفرح، وقلباً لا يعرف الحزن، وأياماً تشبه جمال روحك.' },
      { img: 'photo2.jpg', text: 'كل عام وأنت سند حياتي وأجمل النعم التي أكرمني الله بها ❤️' },
      { img: 'photo3.jpg', text: 'وجودك بجانبي يجعل كل لحظة وصعبة أسهل، وأجمل بكثير 🌸' },
      { img: 'photo4.jpg', text: 'عسى أن تبقى ابتسامتك المشرقة دائماً، وروحك دافئة كما هي ✨' },
      { img: 'photo5.jpg', text: 'دمت لي شيئاً جميلاً لا ينتهي .. كل سنة وأنت طيب وبخير يا كل عمري 🎉' }
    ];

    let currentIndex = 0;

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      document.getElementById('slide-img').src = slides[currentIndex].img;
      document.getElementById('slide-text').innerHTML = slides[currentIndex].text;
    }
  </script>
</body>
</html>
