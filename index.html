<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever ♾️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('bg_lock.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.8s ease-in-out;
            overflow-x: hidden;
            position: relative;
        }

        /* الخلفية الرئيسية تظهر بوضوح تام بدون أي عتمة أو ظل رمادي */
        body.main-bg {
            background: url('bg_main.jpg') no-repeat center center fixed !important;
            background-size: cover !important;
            color: #4a2e35;
        }

        /* تساقط القلوب على الشاشة بالكامل */
        .falling-heart {
            position: fixed;
            top: -10px;
            color: rgba(255, 105, 135, 0.8);
            font-size: 16px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 9999;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            text-align: center;
            padding: 25px 20px;
            position: relative;
            z-index: 2;
            margin-bottom: 70px;
        }

        /* إزالة الكارت الرئيسي الرمادي تماماً من بعد الباسورد لتظهر الخلفية الأصلية */
        body.main-bg .container {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            overflow: visible !important;
        }

        body.main-bg .counter-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 182, 193, 0.6);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        body.main-bg .counter-box p,
        body.main-bg .time-label,
        body.main-bg .secret-box p {
            color: #4a2e35 !important;
            text-shadow: none !important;
        }

        body.main-bg .time-unit {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 192, 203, 0.8);
        }

        body.main-bg .time-num {
            color: #881b3a !important;
        }

        body.main-bg .forever-title {
            color: #881b3a !important;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
        }

        /* الصور مباشرة على الخلفية بدون كروت رمادية */
        body.main-bg .memory-item {
            background: transparent !important;
            backdrop-filter: none !important;
            border: none !important;
            padding: 0 !important;
            box-shadow: none !important;
            margin-bottom: 20px;
        }

        body.main-bg .memory-item img {
            width: 100%;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: block;
        }

        body.main-bg .secret-box {
            background: rgba(255, 240, 243, 0.9);
            border: 1.5px solid rgba(255, 182, 193, 0.8);
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        body.main-bg .secret-text {
            color: #881b3a !important;
            white-space: pre-line;
            line-height: 1.8;
        }

        .hidden {
            display: none !important;
        }

        #lockScreen {
            padding: 40px 20px;
            border-radius: 15px;
        }

        h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .forever-title {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 26px;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 1px;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px rgba(255,255,255,0.3); }
            50% { text-shadow: 0 0 15px rgba(255, 105, 135, 0.8); }
            100% { text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        }

        .password-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        input[type="password"] {
            width: 85%;
            padding: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            text-align: center;
            outline: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        input[type="password"]::placeholder {
            color: #ddd;
        }

        #messageStep {
            padding: 10px;
        }

        /* كارت الرسالة بدون الحواف الرمادية وبشكل متناسق مع الخلفية مباشرة */
        .message-card {
            background: rgba(255, 245, 247, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 22px;
            margin: 15px 0;
            border: 1.5px solid rgba(255, 182, 193, 0.7);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            line-height: 2.2;
            text-align: right;
            font-size: 14px;
            color: #4a2e35;
            font-weight: 600;
        }

        .fade-line {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 1s forwards;
        }

        .fade-line:nth-child(1) { animation-delay: 0.3s; }
        .fade-line:nth-child(2) { animation-delay: 1.5s; }
        .fade-line:nth-child(3) { animation-delay: 3.0s; }
        .fade-line:nth-child(4) { animation-delay: 4.5s; }
        .fade-line:nth-child(5) { animation-delay: 6.0s; }
        .fade-line:nth-child(6) { animation-delay: 7.5s; }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .next-btn {
            background: linear-gradient(135deg, #881b3a, #b83b5e);
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(136, 27, 58, 0.3);
            transition: 0.3s;
            margin-top: 15px;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
        }

        .timer {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 10px;
        }

        .time-num {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .time-label {
            font-size: 11px;
            color: #ddd;
        }

        /* مشغل الصوت الثابت العائم */
        .floating-audio-player {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(255, 240, 243, 0
